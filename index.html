<title>Z7KX | Sensi</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 70% 20%, #1a0a10 0%, #08080a 60%);
    color:#f2f2f2;
    font-family:"Segoe UI",system-ui,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:380px;text-align:center;
    background:rgba(18,18,22,.8);
    border:1px solid rgba(255,23,68,.4);
    border-radius:20px;padding:28px 22px;
    box-shadow:0 0 40px rgba(255,23,68,.25);
  }
  .lock{font-size:38px;margin-bottom:8px}
  h1{font-size:22px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;text-shadow:0 0 12px rgba(255,23,68,.6)}
  h1 span{color:#ff1744}
  .sub{color:#8a8a93;font-size:13px;margin-bottom:18px}
  input{
    width:100%;padding:13px;border-radius:12px;border:1px solid #2c2c35;
    background:#18181d;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:2px;
  }
  input:focus{border-color:#ff1744}
  .err{color:#ff6b6b;font-size:13px;min-height:18px;margin:10px 0 4px}
  button{
    width:100%;padding:13px;background:#ff1744;color:#fff;border:0;border-radius:12px;
    font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    box-shadow:0 0 20px rgba(255,23,68,.45);
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.6;cursor:default}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>

    <h1>Acesso <span>Z7KX</span></h1>
    <p class="sub">Digite a senha para entrar</p>
    <input id="pass" type="password" placeholder="senha" autocomplete="off">
    <p class="err" id="err"></p>
    <button id="enter">Entrar</button>
  </main>

  const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

  async function decifrar(senha){
    const raw = b64(CIPHER);
    const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    return new TextDecoder().decode(buf);
  }

  async function entrar(){
    const senha = $('pass').value.trim();
    if(!senha) return;
    if(!(window.crypto && crypto.subtle)){
      $('err').textContent = 'Abra a página por https ou em um navegador atualizado.';
      return;
    }
    $('err').textContent = 'Verificando...';
    $('enter').disabled = true;
    let html;
    try{
      html = await decifrar(senha);
    }catch(e){
      $('err').textContent = 'Senha incorreta.';
      $('enter').disabled = false;
      $('pass').classList.remove('shake'); void $('pass').offsetWidth;
      $('pass').classList.add('shake');
      return;
    }
    document.open();
    document.write(html);
    document.close();
  }

  $('enter').addEventListener('click', entrar);
  $('pass').addEventListener('keydown', e => { if(e.key === 'Enter') entrar(); });

  /* app instalável (PWA) */
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
